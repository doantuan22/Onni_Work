name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The vitest suites were ~8 of the job's ~9 minutes, so they run as parallel shards
  # beside `verify` instead of inside it.
  vitest:
    name: Server and cockpit unit suites (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run server and cockpit unit suites
        run: npm test -- --shard=${{ matrix.shard }}/3

  verify:
    name: Typecheck, build, E2E, and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `lts/*` — the current Node LTS, whatever it is on the day the job runs, so
      # the gate follows the release line users actually install on instead of
      # freezing on a version that quietly ages out of support. The floor stays the
      # root manifest's `engines.node`; this is the ceiling we verify against.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Build application
        run: npm run build

      - name: Run packaged CLI E2E tests
        run: npm run test:package

      # `build` ends with check:pack, which packs the tarball and refuses one without the
      # cockpit. Onni Work publishes nothing, so this extra pass exists only to keep every
      # packable package honest; the root stays `private` and no workspace is published.
      - name: Verify packable packages
        run: |
          npm pack --dry-run --ignore-scripts -w @open-mercato/cezar

  # Exercise filesystem ownership/recovery on every supported OS. macOS and Windows also
  # build and test the installed release package; Linux does that in `verify` above.
  # Required merge checks are configured separately in branch protection; local test
  # commands still run only on the developer's own OS.
  webhooks-cross-platform:
    # Separate OS checks make platform failures visible in branch protection.
    name: Webhook ownership on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the webhook suite
        if: runner.os != 'Windows'
        run: npm test -- packages/work/src/webhooks

      # A cold Windows PowerShell probe is intentionally fail-closed and expensive. Serial files
      # avoid a worker-start stampede while the first successful probe populates its process cache.
      - name: Run the webhook suite on Windows
        if: runner.os == 'Windows'
        run: npm test -- packages/work/src/webhooks --no-file-parallelism --testTimeout=180000 --hookTimeout=30000

      - name: Build application on macOS and Windows
        if: runner.os != 'Linux'
        run: npm run build

      - name: Run packaged CLI E2E tests on macOS and Windows
        if: runner.os != 'Linux'
        run: npm run test:package

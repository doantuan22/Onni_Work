<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>OnniCode</title>
    <style>
      /* The cockpit's own tokens (packages/web/src/styles/index.css) — dark is the cockpit's
         default, light follows the system. The splash cannot read the cockpit's saved theme
         (different origin), so this is the closest honest match. The accent is the brand mark:
         azure on black, a deeper blue on paper. */
      :root {
        --bg: #070809;
        --fg: #f4f7f2;
        --muted: #9ba49b;
        --soft: #66706a;
        --line: rgba(255, 255, 255, 0.07);
        --line-strong: rgba(255, 255, 255, 0.13);
        --panel: rgba(255, 255, 255, 0.035);
        --accent: #006afe;
        --accent-bright: #3b9bff;
        --accent-ink: #00142e;
        --accent-glow: rgba(0, 106, 254, 0.28);
        --accent-line: rgba(0, 106, 254, 0.6);
        --mark-shadow: rgba(0, 106, 254, 0.3);
        --vignette: rgba(0, 0, 0, 0.32);
        --sans: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        --mono: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f4f6ef;
          --fg: #15180f;
          --muted: #5d6558;
          --soft: #8b9385;
          --line: rgba(21, 24, 15, 0.08);
          --line-strong: rgba(21, 24, 15, 0.15);
          --panel: rgba(255, 255, 255, 0.7);
          --accent: #006afe;
          --accent-bright: #0052c6;
          --accent-ink: #ffffff;
          --accent-glow: rgba(0, 106, 254, 0.2);
          --accent-line: rgba(0, 82, 198, 0.55);
          --mark-shadow: rgba(0, 82, 198, 0.24);
          --vignette: rgba(21, 24, 15, 0.05);
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 13.5px/1.5 var(--sans);
        -webkit-font-smoothing: antialiased;
        -webkit-user-select: none;
        user-select: none;
        overflow: hidden;
      }
      /* The same 28px title strip the cockpit paints under the traffic lights, draggable. */
      .titlebar {
        position: fixed;
        inset: 0 0 auto 0;
        height: 28px;
        z-index: 3;
      }

      /* ---- backdrop ---------------------------------------------------------------- */
      .backdrop {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      /* A single quiet wash behind the mark: the hero is the mark, not the wallpaper. */
      .backdrop::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(900px 520px at 50% -6%, var(--accent-glow), transparent 64%);
        opacity: 0.5;
      }
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 52%, var(--vignette) 100%);
      }

      /* ---- stage ------------------------------------------------------------------- */
      main {
        position: relative;
        z-index: 1;
        height: 100%;
        display: grid;
        place-items: center;
        padding: 44px 24px 76px;
        box-sizing: border-box;
      }
      .stage {
        width: min(620px, 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .stage > * {
        animation: rise 0.65s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      .stage > :nth-child(1) { animation-delay: 0.04s; }
      .stage > :nth-child(2) { animation-delay: 0.1s; }
      .stage > :nth-child(3) { animation-delay: 0.16s; }
      .stage > :nth-child(4) { animation-delay: 0.22s; }
      .stage > :nth-child(5) { animation-delay: 0.28s; }
      .stage > :nth-child(n + 6) { animation-delay: 0.32s; }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
        color: var(--soft);
        font: 600 10px/1 var(--sans);
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }
      .eyebrow::before,
      .eyebrow::after {
        content: '';
        width: 28px;
        height: 1px;
      }
      .eyebrow::before { background: linear-gradient(90deg, transparent, var(--line-strong)); }
      .eyebrow::after { background: linear-gradient(90deg, var(--line-strong), transparent); }

      .mark-wrap {
        position: relative;
        width: 96px;
        height: 96px;
        display: grid;
        place-items: center;
        margin-bottom: 30px;
      }
      /* The azure under-glow breathes behind the glyph — the loading "heartbeat". */
      .mark-glow {
        position: absolute;
        inset: -26px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--accent-glow) 0%, transparent 62%);
        animation: glow-breathe 3.6s ease-in-out infinite;
      }
      .mark {
        position: relative;
        width: 84px;
        height: 84px;
        animation: float 6s ease-in-out infinite;
      }
      /* The mark is a transparent glyph (no tile), so a box-shadow would paint a rectangle
         behind it; drop-shadow follows the glyph's alpha and keeps the failure state's red glow. */
      .mark-glyph {
        width: 100%;
        height: 100%;
        display: block;
        filter: drop-shadow(0 18px 30px var(--mark-shadow));
      }
      /* A light glint sweeps across the glyph every few seconds — the one intentional accent,
         clipped to the mark's own alpha so it reads as a reflection off the logo. */
      .mark-shine {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        -webkit-mask-image: url('icon.svg');
        mask-image: url('icon.svg');
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
      }
      .mark-shine::before {
        content: '';
        position: absolute;
        top: -60%;
        bottom: -60%;
        left: 0;
        width: 36%;
        background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.9), transparent);
        transform: translateX(-260%) skewX(-16deg);
        animation: glint-sweep 4.6s cubic-bezier(0.55, 0.06, 0.2, 0.95) infinite;
        will-change: transform;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.25;
        font-weight: 600;
        letter-spacing: -0.022em;
        color: var(--fg);
      }
      .detail {
        margin: 12px 0 0;
        max-width: min(520px, 82vw);
        padding: 7px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        color: var(--muted);
        font: 11px/1.5 var(--mono);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        direction: ltr;
        unicode-bidi: plaintext;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }
      /* Every failure page: the error sentence wraps instead of a path ellipsis. */
      body.failed .detail {
        white-space: normal;
        overflow: visible;
        border-radius: 12px;
        text-align: left;
      }

      .progress {
        position: relative;
        width: min(300px, 62vw);
        height: 4px;
        margin-top: 28px;
        border-radius: 999px;
        background: var(--line-strong);
        overflow: hidden;
        box-shadow: 0 0 20px var(--accent-glow);
      }
      .progress .track {
        position: absolute;
        inset: 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, var(--accent-bright), transparent);
        animation: sweep 1.9s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      pre {
        -webkit-user-select: text;
        user-select: text;
        text-align: left;
        width: 100%;
        box-sizing: border-box;
        margin: 22px 0 0;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        color: var(--muted);
        font: 11px/1.6 var(--mono);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 32vh;
        overflow: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--line-strong) transparent;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 22px;
      }
      .button {
        appearance: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 38px;
        padding: 0 16px;
        border-radius: 10px;
        border: 1px solid var(--line-strong);
        background: var(--panel);
        color: var(--fg);
        font: 600 12.5px/1 var(--sans);
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
      }
      .button.restart {
        border-color: transparent;
        background: linear-gradient(180deg, var(--accent-bright), var(--accent));
        color: var(--accent-ink);
        box-shadow: 0 14px 30px -14px var(--accent-glow);
      }
      .button:hover {
        transform: translateY(-1px);
      }
      .button:active {
        transform: translateY(0);
      }
      .button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .button[disabled] {
        opacity: 0.6;
        cursor: default;
        transform: none;
      }
      .hidden {
        display: none !important;
      }

      /* ---- footer ------------------------------------------------------------------ */
      .footer {
        position: fixed;
        inset: auto 0 22px;
        z-index: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        opacity: 0.85;
        font: 500 11px/1 var(--sans);
        letter-spacing: 0.02em;
        pointer-events: none;
      }
      .footer .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        color: var(--muted);
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: 9.5px;
      }
      .footer .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px var(--accent-glow);
        animation: blink 2.4s ease-in-out infinite;
      }
      .footer .sep {
        opacity: 0.45;
      }

      /* ---- failure state ----------------------------------------------------------- */
      body.failed {
        --accent: #ff8a7a;
        --accent-bright: #ffb3a7;
        --accent-ink: #1a0a07;
        --accent-glow: rgba(255, 106, 85, 0.2);
        --accent-line: rgba(255, 138, 122, 0.55);
        --mark-shadow: rgba(255, 106, 85, 0.2);
      }
      @media (prefers-color-scheme: light) {
        body.failed {
          --accent: #c2412d;
          --accent-bright: #e05a43;
          --accent-ink: #ffffff;
          --accent-glow: rgba(255, 106, 85, 0.18);
          --accent-line: rgba(194, 65, 45, 0.55);
          --mark-shadow: rgba(194, 65, 45, 0.2);
        }
      }
      body.failed .backdrop::before {
        opacity: 0.45;
      }
      body.failed .mark,
      body.failed .mark-glow,
      body.failed .mark-shine::before {
        animation-play-state: paused;
      }
      body.failed .mark-glow {
        opacity: 0.5;
      }

      /* ---- motion ------------------------------------------------------------------ */
      @keyframes glow-breathe {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.94);
        }
        50% {
          opacity: 1;
          transform: scale(1.06);
        }
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }
      @keyframes glint-sweep {
        0% {
          transform: translateX(-260%) skewX(-16deg);
        }
        45%,
        100% {
          transform: translateX(440%) skewX(-16deg);
        }
      }
      @keyframes sweep {
        0% {
          transform: translateX(-130%);
        }
        100% {
          transform: translateX(330%);
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 0.45;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .backdrop::before,
        .mark-glow,
        .mark,
        .mark-shine::before,
        .progress .track,
        .footer .dot {
          animation: none;
        }
        .stage > * {
          animation: none;
        }
        .mark-shine {
          opacity: 0;
        }
        .progress .track {
          width: 100%;
          opacity: 0.6;
        }
        .footer .dot {
          opacity: 0.9;
        }
      }

      /* ---- compact windows --------------------------------------------------------- */
      @media (max-height: 560px), (max-width: 640px) {
        main {
          padding-bottom: 36px;
        }
        .footer {
          display: none;
        }
        .eyebrow {
          margin-bottom: 18px;
        }
        .mark-wrap {
          width: 76px;
          height: 76px;
          margin-bottom: 18px;
        }
        .mark {
          width: 66px;
          height: 66px;
        }
        .mark-glow {
          inset: -20px;
        }
        h1 {
          font-size: 19px;
        }
        pre {
          max-height: 38vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="titlebar" data-tauri-drag-region></div>
    <div class="backdrop" aria-hidden="true">
      <div class="vignette"></div>
    </div>
    <main>
      <section class="stage" aria-live="polite">
        <span class="eyebrow">Local cockpit</span>
        <div class="mark-wrap" aria-hidden="true">
          <div class="mark-glow"></div>
          <div class="mark">
            <img class="mark-glyph" src="icon.svg" alt="" />
            <span class="mark-shine"></span>
          </div>
        </div>
        <h1 id="title">Starting OnniCode…</h1>
        <p id="detail" class="detail">Launching the local cockpit.</p>
        <div id="spinner" class="progress" role="progressbar" aria-label="Starting OnniCode"><span class="track"></span></div>
        <pre id="log" class="hidden"></pre>
        <div id="actions" class="actions hidden">
          <button id="retry" class="button restart" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
            <span id="retry-label">Restart OnniCode</span>
          </button>
        </div>
        <p id="hint" class="hidden"></p>
      </section>
    </main>
    <footer class="footer">
      <span class="chip"><span class="dot"></span>Local-first</span>
      <span>Runs entirely on this machine</span>
      <span class="sep">·</span>
      <span>No account, no cloud</span>
    </footer>
    <script>
      // The Rust side drives this page through `eval` — no Tauri IPC is needed for a splash.
      window.onniSplash = {
        set(title, detail) {
          document.getElementById('title').textContent = title
          const line = document.getElementById('detail')
          line.textContent = detail
          line.title = detail
        },
        fail(title, detail, log) {
          this.set(title, detail)
          document.body.classList.add('failed')
          document.getElementById('spinner').classList.add('hidden')
          const pre = document.getElementById('log')
          pre.textContent = log || ''
          pre.classList.toggle('hidden', !log)
        },
      }
      const params = new URLSearchParams(location.search)
      // Every failure page: the error, its log and "Restart OnniCode" — which restarts the app
      // (`restart_app`).
      if (params.get('error')) {
        window.onniSplash.fail(params.get('title') || 'OnniCode stopped', params.get('error'), params.get('log') || '')
        document.getElementById('actions').classList.remove('hidden')
        document.getElementById('retry').onclick = function () {
          const label = document.getElementById('retry-label')
          this.disabled = true
          label.textContent = 'Restarting…'
          if (window.__TAURI_INTERNALS__) window.__TAURI_INTERNALS__.invoke('restart_app')
        }
      } else if (params.get('title')) {
        window.onniSplash.set(params.get('title'), params.get('detail') || '')
      }
    </script>
  </body>
</html>

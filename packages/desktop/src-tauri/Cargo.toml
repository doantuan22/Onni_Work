[package]
name = "onni-desktop"
version = "0.1.11"
description = "Desktop shell for Onni Work"
edition = "2021"
publish = false
license = "MIT"
authors = ["DOANTUANIT"]
repository = "https://github.com/doantuan22/Onni_Work"

[lib]
name = "onni_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
ctrlc = { version = "3", features = ["termination"] }

# The macOS agent trampoline (`disclaim.rs`) calls posix_spawn directly.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Windows links `current` with a junction — a directory link that needs no privilege.
[target.'cfg(windows)'.dependencies]
junction = "1"

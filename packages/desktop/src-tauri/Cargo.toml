[package]
name = "onni-desktop"
version = "0.1.0"
description = "Desktop shell for OnniCode"
edition = "2021"
publish = false
license = "MIT"
authors = ["DOANTUANIT"]
repository = "https://github.com/doantuan22/Onni_Work"

[lib]
name = "onni_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
ctrlc = { version = "3", features = ["termination"] }

# The macOS agent trampoline (`disclaim.rs`) calls posix_spawn directly.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Windows links `current` with a junction — a directory link that needs no privilege.
# windows-sys hands a URL to the shell as one UTF-16 argument (`ShellExecuteW`); `cmd /C start`
# parsed `&`, `|` and `%` in it — see `open_url` in lib.rs.
[target.'cfg(windows)'.dependencies]
junction = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
